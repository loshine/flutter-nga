name: flutter_nga
description: A new Flutter project.
publish_to: none

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# Read more about versioning at semver.org.
version: 1.1.0+10100

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # go_router 的 Cupertino 默认错误页使用此字体绘制返回箭头。
  cupertino_icons: ^1.0.9
  community_material_icon: ^5.9.55

  flutter_riverpod: ^3.5.0
  hooks_riverpod: ^3.5.0
  flutter_hooks: ^0.21.4
  go_router: ^18.1.4
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  fast_gbk: ^1.0.0
  sembast: ^3.10.1
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.7
  html_unescape: ^2.0.0
  timeago: ^3.7.1
  intl: ^0.20.3
  adaptive_theme: ^3.8.0
  photo_view: ^0.15.0
  # easy_refresh >=3.5.0 在 Dart 3 下对 TargetPlatform 做穷举 switch，缺少 TargetPlatform.ohos
  easy_refresh: 3.4.0
  collection: ^1.19.1
  cached_network_image: ^4.0.7
  toastification: ^3.2.2
  flutter_native_splash: ^2.4.8
  gal: ^3.0.1
  path: ^1.9.1

  # ====== 鸿蒙适配依赖 (OpenHarmony) - 3.50.0+ohos-0.0.1-pre ======
  material_ui:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/material_ui
      ref: oh-3.47.7-dev

  cupertino_ui:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/cupertino_ui
      ref: oh-3.47.7-dev

  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos

  device_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/device_info_plus/device_info_plus
      ref: br_device_info_plus-v12.3.0_ohos

  package_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/package_info_plus/package_info_plus
      ref: br_package_info_plus-v9.0.0_ohos

  flutter_inappwebview:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_inappwebview.git
      path: flutter_inappwebview
      ref: br_v6.1.5_ohos

  image_picker:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/image_picker/image_picker
      ref: br_image_picker-v1.2.1_ohos

  url_launcher:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: br_url_launcher-v6.3.2_ohos

  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  image: ^4.13.1

dependency_overrides:
  material_ui:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/material_ui
      ref: oh-3.47.7-dev
  cupertino_ui:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/cupertino_ui
      ref: oh-3.47.7-dev
  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  flutter_inappwebview_platform_interface:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_inappwebview.git
      path: flutter_inappwebview_platform_interface
      ref: br_v6.1.5_ohos
  sqflite:
