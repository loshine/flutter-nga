name: Build

# 发版相关 PR 验证各平台构建。推送版本 tag 时发布 Android 签名分 ABI APK、Universal APK 和 AAB。
# 签名使用 Environment「Android Build」的 Secrets：JKS（keystore 的 base64）、STORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD。
on:
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".tool-versions"
      - "pubspec.*"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "web/**"
      - "windows/**"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 pubspec.yaml 的 version ${version} 不一致"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  android:
    name: Build signed Android packages
    if: github.ref_type == 'tag'
    needs: version
    runs-on: ubuntu-latest
    environment: Android Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - uses: jdx/mise-action@v4
        with:
          version: "2026.11.10"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test --no-pub

      # 缺少签名 Secrets 时直接失败，避免发布回退到 debug 签名的安装包。
      - name: Restore release keystore
        env:
          JKS: ${{ secrets.JKS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in JKS STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少签名 Secret ${name}（Environment「Android Build」）"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          if ! printf '%s' "$JKS" | base64 --decode --ignore-garbage > "$keystore"; then
            echo "::error::Secret JKS 不是有效的 base64，请用 base64 -i <keystore>.jks 的输出重新填写"
            exit 1
          fi
          # 校验密码与别名，并打印证书指纹，便于与本地 keystore 对照（指纹不是敏感信息）。
          if ! keytool -list -v -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
              | grep -E 'SHA(1|256):'; then
            echo "::error::无法用 STORE_PASSWORD / KEY_ALIAS 读取 JKS，请检查这三个 Secret"
            exit 1
          fi
          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Maven Central 偶尔返回 429，失败后等待重试。
      # 每次构建后立即收集对应产物，避免后续 flutter build apk 覆盖或清理输出目录。
      - name: Build Android packages and collect artifacts
        run: |
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "第 ${attempt} 次构建失败：$*"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 60))
            done
            return 1
          }
          mkdir -p dist
          retry flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk "dist/flutter-nga-${GITHUB_REF_NAME}-universal.apk"
          retry flutter build apk --release --split-per-abi --no-pub
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/flutter-nga-${GITHUB_REF_NAME}-${abi}.apk"
          done
          retry flutter build appbundle --release --no-pub
          cp build/app/outputs/bundle/release/app-release.aab "dist/flutter-nga-${GITHUB_REF_NAME}.aab"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: flutter-nga-android
          path: dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Clean up signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

  android-check:
    name: Check Android release builds
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - uses: jdx/mise-action@v4
        with:
          version: "2026.11.10"
      - run: flutter pub get
      - name: Build Universal APK
        run: |
          flutter build apk --release --no-pub
          test -f build/app/outputs/flutter-apk/app-release.apk
      - name: Build per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi --no-pub
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "build/app/outputs/flutter-apk/app-${abi}-release.apk"
          done
      - name: Build App Bundle
        run: |
          flutter build appbundle --release --no-pub
          test -f build/app/outputs/bundle/release/app-release.aab

  platforms:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
          - target: windows
            os: windows-latest
          - target: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: "2026.11.10"
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter pub get
      - name: Build ${{ matrix.target }} app
        run: flutter build ${{ matrix.target }} --release --no-pub
      - name: Package macOS app
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/FNGA.app "dist/flutter-nga-${RELEASE_TAG}-macos.zip"
      - name: Package Windows app
        if: matrix.target == 'windows'
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "dist/flutter-nga-${env:RELEASE_TAG}-windows-x64.zip"
      - name: Package Linux app
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf "dist/flutter-nga-${RELEASE_TAG}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: flutter-nga-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  ios-check:
    name: Check iOS release build
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: "2026.11.10"
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --no-pub
        env:
          LANG: en_US.UTF-8

  web-check:
    name: Build Web preview
    # Browser startup still needs a Web-compatible database.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: "2026.11.10"
      - run: flutter pub get
      - run: flutter build web --release --no-pub
      - uses: actions/upload-artifact@v7
        with:
          name: web-preview
          path: build/web/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flutter-nga-android
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
