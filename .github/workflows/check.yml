name: test
on: pull_request

jobs:
  check:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # The plugin's example LFS assets are not needed by this application.
      GIT_LFS_SKIP_SMUDGE: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub global activate fvm
      - run: fvm fork add ohos https://gitcode.com/CPF-Flutter/flutter_flutter.git
      - run: fvm install
      # Host unit/widget tests do not require a DevEco SDK or HAP artifacts.
      - run: fvm flutter config --no-enable-ohos
      - run: fvm flutter pub get
      - run: fvm flutter test --no-pub test/
